theme = "modus_operandi"

[editor]
line-number = "relative"
cursorline = true
color-modes = true
true-color = true
rulers = [80]
default-yank-register = "+"
auto-format = true
end-of-line-diagnostics = "hint"

[editor.auto-save]
focus-lost = true

[editor.auto-save.after-delay]
enable = true
timeout = 2000

[editor.lsp]
display-messages = true
display-progress-messages = true
display-inlay-hints = false
auto-signature-help = true

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "disable"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[keys.normal]
"Cmd-/" = "toggle_comments"
"Cmd-s" = ":write"
"Cmd-S" = ":reload-all"

[keys.normal.space]
q = ":quit"
w = ":write"
space = "command_mode"

[keys.insert]
"Cmd-s" = ":write"

[keys.select]
"Cmd-/" = "toggle_comments"
"Cmd-s" = ":write"
